version: "3"

tasks:
  db:up:
    desc: Start local PostgreSQL
    cmds:
      - docker compose up -d --wait postgres

  db:down:
    desc: Stop local PostgreSQL
    cmds:
      - docker compose down

  dev:
    desc: Start the API server
    deps: [db:up]
    cmds:
      - go run ./cmd/api/main.go

  generate:
    desc: Generate server-rendered Templ components
    cmds:
      - go tool templ generate

  css:build:
    desc: Build Tailwind CSS
    cmds:
      - tailwindcss -i ./assets/css/input.css -o ./assets/css/output.css --minify

  docs:lint:
    desc: Validate the OpenAPI contract
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/spec" -w /spec redocly/cli:2.41.0 lint

  dev:web:
    desc: Start the web interface
    deps: [db:up, generate]
    cmds:
      - go run ./cmd/web/main.go

  ingest:s3:
    desc: Discover wallets from Hyperliquid S3 fills
    deps: [db:up]
    cmds:
      - go run ./cmd/s3ingest

  test:
    desc: Run unit tests
    cmds:
      - go tool templ generate
      - go test ./...

  test:integration:
    desc: Run all tests against local PostgreSQL
    deps: [db:up]
    env:
      TEST_DATABASE_URL: postgres://hypermetrics:hypermetrics@localhost:5432/hypermetrics?sslmode=disable
    cmds:
      - go tool templ generate
      - go test ./...
