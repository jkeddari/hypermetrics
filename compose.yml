services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hypermetrics
      POSTGRES_PASSWORD: hypermetrics
      POSTGRES_DB: hypermetrics
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypermetrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
