services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: hypermetrics
      POSTGRES_PASSWORD: hypermetrics
      POSTGRES_DB: hypermetrics
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hypermetrics"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  s3-ingest:
    profiles: ["ingestion"]
    build:
      context: .
      dockerfile: Dockerfile.s3ingest
    environment:
      DATABASE_URL: postgres://hypermetrics:hypermetrics@postgres:5432/hypermetrics?sslmode=disable
      S3_INGEST_LOOKBACK: ${S3_INGEST_LOOKBACK:-720h}
      S3_INGEST_POLL_INTERVAL: ${S3_INGEST_POLL_INTERVAL:-15m}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
