name: API documentation

on:
  pull_request:
    paths:
      - docs/openapi.yaml
      - redocly.yaml
      - .github/workflows/api-docs.yml
  push:
    branches: [main]
    paths:
      - docs/openapi.yaml
      - redocly.yaml
      - .github/workflows/api-docs.yml

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @redocly/cli@2.41.0 lint
